workflows:
  android-debug:
    name: ManyDrive Android Debug
    # Available on Codemagic personal accounts without billing enabled.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Set up Android SDK
        script: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  android-release:
    name: ManyDrive Android Release
    # Available on Codemagic personal accounts without billing enabled.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      groups:
        - github_release
      vars:
        GITHUB_RELEASE_REPO: starfall-org/manydrive
      android_signing:
        # Must match the Reference name in Codemagic's Android keystores tab.
        - ManyDrive
    scripts:
      - name: Set up Android SDK
        ignore_failure: false
        script: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Check release signing credentials
        ignore_failure: false
        script: |
          set -euo pipefail
          : "${CM_KEYSTORE_PATH:?Missing keystore path}"
          : "${CM_KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${CM_KEY_ALIAS:?Missing key alias}"
          : "${CM_KEY_PASSWORD:?Missing key password}"
          test -f "$CM_KEYSTORE_PATH"
      - name: Prepare GitHub release publishing
        ignore_failure: false
        script: |
          set -euo pipefail
          GITHUB_RELEASE_TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
          : "${GITHUB_RELEASE_TOKEN:?Set secret GITHUB_TOKEN (or GH_TOKEN) in environment group github_release}"
          if ! command -v gh >/dev/null 2>&1; then
            brew install gh --quiet
          fi
          gh --version >/dev/null
      - name: Build ABI-specific release APKs
        ignore_failure: false
        script: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Detect release tag from built app version
        ignore_failure: false
        script: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Invalid app version: $version" >&2; exit 1; }
          tag="v$version"
          if [[ -n "${CM_TAG:-}" && "$CM_TAG" != "$tag" ]]; then
            echo "Build tag $CM_TAG does not match app version $tag." >&2
            exit 1
          fi
          printf 'MANYDRIVE_RELEASE_TAG=%s\n' "$tag" >> "$CM_ENV"
          echo "Publishing $tag from $(git rev-parse HEAD)"
      - name: Move tag to build commit and replace GitHub release APKs
        ignore_failure: false
        script: |
          set -euo pipefail
          bash scripts/publish-github-release.sh
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/apk/release/*.sha1
